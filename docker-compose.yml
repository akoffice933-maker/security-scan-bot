services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Redis is internal-only. Do not publish 6379 to the host.

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scanbot
      POSTGRES_PASSWORD: scanbot
      POSTGRES_DB: scanbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanbot -d scanbot"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Postgres is internal-only.

  bot:
    build:
      context: .
      args:
        WITH_CLAMAV: "1"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://scanbot:scanbot@postgres:5432/scanbot
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: python -m app.main

  worker:
    build:
      context: .
      args:
        WITH_CLAMAV: "1"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://scanbot:scanbot@postgres:5432/scanbot
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=2

volumes:
  redis_data:
  postgres_data:
