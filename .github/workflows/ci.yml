name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Unit tests
        run: pytest -q
        env:
          BOT_TOKEN: "123456:TEST"
          ADMIN_IDS: "1"
          ALLOWED_DOMAINS: "example.com,localhost"
          ALLOWED_GITHUB_ORGS: "myorg"
          ALLOWED_DOCKER_REGISTRIES: "docker.io"
          LLM_ENABLED: "false"
          ENVIRONMENT: "test"
      - name: Smoke (Bandit on fixture)
        run: pytest -q tests/test_smoke.py
        env:
          BOT_TOKEN: "123456:TEST"
          ADMIN_IDS: "1"
          LLM_ENABLED: "false"
          ENVIRONMENT: "test"
