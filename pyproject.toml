[project]
name = "security-scan-bot"
version = "0.2.0"
description = "Telegram bot + MCP server for scanning your own projects (Nuclei, Semgrep, Trivy, ClamAV, VirusTotal). Fail-closed allowlists. MIT."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy>=2.0.0",
    "redis>=5.0.0",
    "orjson>=3.10.0",
    "tenacity>=9.0.0",
    "celery[redis]>=5.4.0",
    "fpdf2>=2.8.0",
    "bandit>=1.7.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
