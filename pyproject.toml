[project]
name = "security-scan-bot"
version = "0.1.0"
description = "Telegram bot for security scanning of your own projects (Nuclei + Semgrep + Trivy + LLM)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "redis>=5.0.0",
    "orjson>=3.10.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
